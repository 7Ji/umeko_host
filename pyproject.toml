[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umeko-host"
version = "0.1.0"
description = "Cross-platform thermal camera host for Umeko-derived firmware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pyserial>=3.5",
  "PySide6>=6.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
umeko-host = "umeko_host.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/umeko_host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
